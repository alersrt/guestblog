micronaut:

  server:
    port: ${GB_SERVER_PORT:8080}
    multipart:
      enabled: true
      max-file-size: 5242880
      threshold: 2048

  security:
    oauth2:
      clients:
        google:
          client-id: ${OAUTH2_GOOGLE_CLIENT_ID}
          client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET}
          scopes:
            - https://www.googleapis.com/auth/userinfo.email
            - https://www.googleapis.com/auth/userinfo.profile
        github:
          client-id: ${OAUTH2_GITHUB_CLIENT_ID}
          client-secret: ${OAUTH2_GITHUB_CLIENT_SECRET}
          scopes:
            - user:email
            - read:user
            - public_repo
          authorization:
            url: https://github.com/login/oauth/authorize
          token:
            url: https://github.com/login/oauth/access_token
            auth-method: CLIENT_SECRET_POST
    authentication: cookie
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_GENERATOR_SIGNATURE_SECRET:${random.uuid}}
    endpoints:
      logout:
        get-allowed: true

datasources:
  default:
    url: ${GB_POSTGRES_URL:jdbc:postgresql://localhost:5432/gbdb}
    username: ${GB_POSTGRES_USERNAME:gb_user_rw}
    password: ${GB_POSTGRES_PASSWORD:gb_user_rw}
    driver-class-name: org.postgresql.Driver
